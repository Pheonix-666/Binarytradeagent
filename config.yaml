mode: paper                 # record | paper | demo | live
live_requires_env: LIVE_CONFIRM

data:
  daily_boundary_tz: "UTC"
  min_bar_coverage: 0.98
  calendars:
    forex:
      type: "weekly_windows"
      windows:
        - open_day: "Sun"
          open_time: "17:00"
          close_day: "Fri"
          close_time: "17:00"
          tz: "America/New_York"
      daily_boundary_tz: "America/New_York"
      daily_boundary_hour: 17
    crypto:
      type: "always_open"
      windows: []
      daily_boundary_tz: "UTC"
      daily_boundary_hour: 0
  assets:
    EURUSD: "forex"
    GBPUSD: "forex"
    USDJPY: "forex"
    AUDUSD: "forex"
    NZDUSD: "forex"
    USDCAD: "forex"
    USDCHF: "forex"
    BTCUSD: "crypto"
    ETHUSD: "crypto"

trading:
  expiry_minutes: 30        # 15 | 30 | 60
  allowed_expiries: [15, 30, 60]
  check_interval_minutes: 5
  asset_reselect_hours: 2
  top_assets: 5
  max_measured_slots: 3
  min_trades_for_stats: 30
  tie_policy: "loss"        # refund | loss

stake:
  min_pct: 1
  max_pct: 20
  total_cap_pct: 35
  daily_loss_limit_pct: null
  # NOTE: min_amount and round_to are placeholders that must be set to the platform's
  # real minimum trade amount and increment before running in demo or live mode.
  min_amount: 1.0
  max_amount: 1000.0   # placeholder for platform maximum single trade stake
  round_to: 1.0

gate:
  strict_trend_gate: true
  reversal_mode: off           # off | sr_bypass
  trend:
    daily:
      ema_fast: 20
      ema_slow: 50
      adx_period: 14
      adx_min: 20
      warmup_multiplier: 3     # at least 3x slow EMA period
    h1:
      ema_fast: 20
      ema_slow: 50
      adx_period: 14
      adx_min: 20
      warmup_multiplier: 3
    m15:
      ema_fast: 20
      ema_slow: 50
      adx_period: 14
      adx_min: 20
      warmup_multiplier: 3
  reversal_bypass:
    min_similarity: 80
    max_risk_score: 40
    require_sr_level: true
    require_confirmation_candle: true
    max_volatility_percentile: 90

levels:
  swing_left_bars: 5
  swing_right_bars: 2
  cluster_tolerance_atr: 0.5
  at_level_tolerance_atr: 0.5

patterns:
  templates_dir: "patterns/templates"
  timeframes: ["5m", "15m"]
  min_similarity: 60
  template_points: 64
  window_lengths: [30, 45, 60, 90]
  dtw_shortlist: 3
  dtw_weight: 0.3              # weight of DTW in final similarity: (1-w)*corr + w*dtw
  dtw_sakoe_chiba_radius: 6    # Sakoe-Chiba constraint band radius
  allow_trade_without_pattern: false

risk:
  weights:
    volatility: 0.2
    pattern: 0.2
    win_rate: 0.2
    session: 0.2
    sr_distance: 0.2
  volatility_lookback_days: 30
  atr_period: 14
  session_min_samples: 20
  stats_modes: ["paper", "demo", "live"]
  defaults:
    pattern_missing: 100.0
    untested_asset: 100.0
    session_missing: 50.0
    no_sr_level: 10.0
    sr_unknown: 50.0
    volatility_missing: 50.0
  sr_distance_min_atr: 0.5
  sr_distance_max_atr: 3.0
  sr_distance_near_score: 90.0
  sr_distance_far_score: 10.0

paper_gate:
  min_paper_trades: 200
  min_edge_margin: 0.02
  require_ci_lower_bound: false

selection:
  correlation_lookback: 50
  correlation_min: 0.7
  rolling_window: 100
  shrinkage_k: 50.0
  ranking_modes: ["paper", "demo", "live"]

safety:
  max_orders_per_window: 6
  stale_data_multiplier: 2
  max_consecutive_exec_errors: 3
  kill_file: KILL
  balance_tolerance: 1.0
  rounding_tolerance: 0.001
  stake_verification_tolerance: 0.01
  rate_limit_window_minutes: 10

llm:
  provider: anthropic
  model: claude-sonnet-5-5
  temperature: 0
  max_tokens: 800
  timeout_seconds: 20
  max_decision_age_seconds: 30
  max_price_move_atr: 0.25
  evidence_float_tolerance: 0.01
  max_calls_per_hour: 60
  default_atr: null

alerts:
  telegram_enabled: true

backtest:
  default_payout: 0.85
  train_fraction: 0.7
  target_win_rate: 0.80
  assets: ["EURUSD", "GBPUSD", "USDJPY", "AUDUSD"]
  starting_balance: 10000.0
  decision_policy: "lowest_risk"  # lowest_risk | highest_similarity | llm
  stake_policy: "max"             # max | mid | min
  entry_delay_bars: 1
  slippage_atr: 0.02
  ignore_paper_gate: true
  max_llm_steps: 200

adaptive:
  enabled: true
  reference: peak           # peak | session_start | checkpoint
  tiers:
    caution:
      drawdown_pct: 15
      consecutive_losses: 4
      stake_scale: 0.5
      min_similarity_add: 5
      max_risk_cap: 50
    defensive:
      drawdown_pct: 25
      stake_scale: 0.35
      reversal_mode: "off"
      min_similarity_add: 10
      max_risk_cap: 40
    paused:
      drawdown_pct: 40
      real_trading: false
  hysteresis_recovery_fraction: 0.5
  requalification:
    min_shadow_trades: 30
    win_rate_margin: 0.0
    rampup_trades: 20
    rampup_stake_scale: 0.5
  profiles:
    standard: {}
    conservative:
      patterns.min_similarity: 85.0
      max_risk_cap: 45
      stake_scale: 0.8
  profile_switch:
    min_shadow_trades: 50
    require_ci_lower_above_break_even: true
    min_ev_advantage: 0.02
    cooldown_days: 3
  context_learning:
    min_trades: 30
    z: 2.58
    cooldown_days: 3
    max_suspended_fraction: 0.3
    keys: [asset, hour_bucket, pattern, risk_bucket, volatility_bucket, expiry]
  edge_decay:
    window_trades_caution: 60
    z_caution: 1.0
    window_trades: 100
    min_trades: 30
    z: 1.96
    tier_on_decay: caution
    tier_on_persistent: defensive
    persist_windows: 2
