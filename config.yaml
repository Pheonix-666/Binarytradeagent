mode: paper                 # record | paper | demo | live
live_requires_env: LIVE_CONFIRM

data:
  daily_boundary_tz: "UTC"

trading:
  expiry_minutes: 30        # 15 | 30 | 60
  allowed_expiries: [15, 30, 60]
  check_interval_minutes: 5
  asset_reselect_hours: 2
  top_assets: 5
  max_measured_slots: 3
  min_trades_for_stats: 30

stake:
  min_pct: 2
  max_pct: 20
  total_cap_pct: 35
  daily_loss_limit_pct: null
  # NOTE: min_amount and round_to are placeholders that must be set to the platform's
  # real minimum trade amount and increment before running in demo or live mode.
  min_amount: 1.0
  round_to: 1.0

gate:
  strict_trend_gate: true
  reversal_mode: off           # off | sr_bypass
  trend:
    daily:
      ema_fast: 20
      ema_slow: 50
      adx_period: 14
      adx_min: 20
      warmup_multiplier: 3     # at least 3x slow EMA period
    h1:
      ema_fast: 20
      ema_slow: 50
      adx_period: 14
      adx_min: 20
      warmup_multiplier: 3
    m15:
      ema_fast: 20
      ema_slow: 50
      adx_period: 14
      adx_min: 20
      warmup_multiplier: 3
  reversal_bypass:
    min_similarity: 80
    max_risk_score: 40
    require_sr_level: true
    require_confirmation_candle: true
    max_volatility_percentile: 90

levels:
  swing_left_bars: 5
  swing_right_bars: 2
  cluster_tolerance_atr: 0.5
  at_level_tolerance_atr: 0.5

patterns:
  timeframes: ["5m", "15m"]
  min_similarity: 60
  template_points: 64
  window_lengths: [30, 45, 60, 90]
  dtw_shortlist: 3
  dtw_weight: 0.3              # weight of DTW in final similarity: (1-w)*corr + w*dtw
  dtw_sakoe_chiba_radius: 6    # Sakoe-Chiba constraint band radius
  allow_trade_without_pattern: false

risk:
  weights:
    volatility: 0.2
    pattern: 0.2
    win_rate: 0.2
    session: 0.2
    sr_distance: 0.2
  volatility_lookback_days: 30
  atr_period: 14
  session_min_samples: 20
  defaults:
    pattern_missing: 100.0
    untested_asset: 100.0
    session_missing: 50.0
    no_sr_level: 10.0
    sr_unknown: 50.0
    volatility_missing: 50.0
  sr_distance_min_atr: 0.5
  sr_distance_max_atr: 3.0
  sr_distance_near_score: 90.0
  sr_distance_far_score: 10.0

paper_gate:
  min_paper_trades: 200
  min_edge_margin: 0.02

selection:
  correlation_lookback: 50
  correlation_min: 0.7
  rolling_window: 100

safety:
  max_orders_per_10min: 6
  stale_data_multiplier: 2
  max_consecutive_exec_errors: 3
  kill_file: KILL

llm:
  provider: anthropic
  model: claude-sonnet-5-5
  temperature: 0
  max_tokens: 800
  timeout_seconds: 20
  max_decision_age_seconds: 30

alerts:
  telegram_enabled: true

backtest:
  default_payout: 0.85
  train_fraction: 0.7
